name: Chronicle & Quill CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    name: Build, Audit & Test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017/chronicle_quill
      MONGODB_DB: chronicle_quill
      SESSION_SECRET: chronicle_and_quill_super_secure_secret_key_32chars_minimum!
      CI: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: ESLint Code Quality
        run: npm run lint

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Initialize Database Seed
        run: npm run seed

      - name: Business Logic Unit Tests
        run: npm run test:unit

      - name: Full-Stack API Integration Tests
        run: npm run test:qa

      - name: Production Bundle Compilation
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E & Accessibility Audits
        run: npm run test:e2e

      - name: Upload Playwright Failure Artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
