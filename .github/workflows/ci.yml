name: Chronicle & Quill CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    name: Build, Audit & Test
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: "mongodb://127.0.0.1:27017/chronicle_quill_ci"
      MONGODB_DB: "chronicle_quill_ci"
      SESSION_SECRET: "ci-testing-session-secret-key-must-be-32-chars"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NODE_ENV: "test"
      CI: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

      - name: ESLint Code Quality
        run: npm run lint

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Initialize Database Seed
        run: npm run seed

      - name: Business Logic Unit Tests
        run: npm run test:unit

      - name: Full-Stack API Integration Tests
        run: npm run test:qa

      - name: Production Bundle Compilation
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E & Accessibility Audits
        run: npm run test:e2e

      - name: Upload Playwright Failure Artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
